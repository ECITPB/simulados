    <style>
        /* Estilos Globais baseados na identidade Premium */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #111827, #0f172a);
            background-size: 400% 400%;
            color: #f1f5f9;
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Topo da página de Simulado */
        .header-simulado {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 4px solid #38bdf8; /* Tom Linguagens */
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header-simulado h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Card de Configuração Inicial */
        .config-card {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .config-card h2 {
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #ffffff;
        }

        .config-card p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Badge para total de questões do banco */
        .badge-total {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Select customizado e controles */
        .select-wrapper {
            margin-bottom: 30px;
        }

        select {
            background: #1e293b;
            color: #f1f5f9;
            border: 2px solid #38bdf8;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            width: 200px;
            transition: all 0.3s ease;
        }

        select:focus {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Mensagem de Erro */
        .erro-mensagem {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        /* Botão Estilizado */
        .btn {
            display: inline-block;
            padding: 14px 35px;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
        }

        /* Botão desabilitado */
        .btn:disabled {
            background: #475569 !important;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Barra de Informações do Simulado Ativo */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cronometro {
            font-weight: 600;
            font-size: 1.1rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Container de Questões */
        #simulado-container {
            display: none;
        }

        .questao-card {
            background: rgba(30, 41, 59, 0.35);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .questao-header {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .questao-texto {
            color: #e2e8f0;
            font-size: 1.1rem;
            margin-bottom: 25px;
            white-space: pre-line;
            text-align: justify;
        }

        .alternativas-lista {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .alternativa-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alternativa-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .alternativa-item.selecionada {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .letra-opcao {
            font-weight: 700;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Área do Botão de Ação Inferior */
        .actions-container {
            text-align: center;
            margin-top: 40px;
        }

        /* Resultados e Gabarito Estilizado */
        .resultado-card {
            background: rgba(30, 41, 59, 0.75);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            text-align: center;
            border: 2px solid #38bdf8;
            display: none;
        }

        .resultado-card h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .score-text {
            font-size: 1.5rem;
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        /* Classes de Correção aplicadas via JS */
        .alternativa-item.correta {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #a7f3d0 !important;
            cursor: not-allowed;
        }

        .alternativa-item.correta .letra-opcao {
            color: #10b981 !important;
            background: rgba(16, 185, 129, 0.1);
        }

        .alternativa-item.errada {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            cursor: not-allowed;
        }

        .alternativa-item.errada .letra-opcao {
            color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.1);
        }
        
        .alternativa-item.bloqueada {
            pointer-events: none;
            opacity: 0.7;
        }
        
        .feedback-label {
            margin-left: auto;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
    </style>
</head>

        /* Lógica e Variáveis Globais de Execução */
        let questoesSelecionadas = [];
        let respostasEstudante = {};
        let tempoSegundos = 0;
        let cronometroInterval;

        // Contagem automática pelo tamanho da lista
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-banco').textContent = bancoQuestoes.length;
        });

        // Inicia o Simulado e Escolhe as questões aleatoriamente
        function iniciarSimulado() {
            const qtdDesejada = parseInt(document.getElementById('qtd-questoes').value);
            const divErro = document.getElementById('erro-mensagem');

            if (bancoQuestoes.length < qtdDesejada) {
                divErro.innerText = `Erro: O banco de dados possui apenas ${bancoQuestoes.length} questões cadastradas. Não é possível gerar um simulado de ${qtdDesejada} questões.`;
                divErro.style.display = 'block';
                return;
            }

            divErro.style.display = 'none';
            document.getElementById('config-card').style.display = 'none';
            document.getElementById('simulado-container').style.display = 'block';

            questoesSelecionadas = [...bancoQuestoes].sort(() => 0.5 - Math.random()).slice(0, qtdDesejada);
            
            document.getElementById('contador-questoes').innerText = `Simulado: ${qtdDesejada} Questões Selecionadas`;
            
            renderizarQuestoes();
            iniciarCronometro();
        }

        // Renderiza as questões tratadas no HTML dinamicamente
        function renderizarQuestoes() {
            const container = document.getElementById('questoes-lista');
            container.innerHTML = '';
            const letras = ['A', 'B', 'C', 'D', 'E'];

            questoesSelecionadas.forEach((questao, indexGrid) => {
                const card = document.createElement('div');
                card.className = 'questao-card';
                card.id = `q-card-${questao.id}`;

                const header = document.createElement('div');
                header.className = 'questao-header';
                header.innerText = `Questão ${indexGrid + 1} • ${questao.origem}`;

                const texto = document.createElement('div');
                texto.className = 'questao-texto';
                texto.innerText = questao.texto;

                const listaAlternativas = document.createElement('ul');
                listaAlternativas.className = 'alternativas-lista';

                questao.alternativas.forEach((alternativa, indexAlt) => {
                    const item = document.createElement('li');
                    item.className = 'alternativa-item';
                    item.id = `alt-${questao.id}-${indexAlt}`;
                    item.onclick = () => selecionarAlternativa(questao.id, indexAlt);

                    const letra = document.createElement('span');
                    letra.className = 'letra-opcao';
                    letra.innerText = letras[indexAlt];

                    const textoOpcao = document.createElement('span');
                    textoOpcao.innerText = alternativa;

                    item.appendChild(letra);
                    item.appendChild(textoOpcao);
                    listaAlternativas.appendChild(item);
                });

                card.appendChild(header);
                card.appendChild(texto);
                card.appendChild(listaAlternativas);
                container.appendChild(card);
            });
        }

        // Registra a alternativa clicada pelo usuário
        function selecionarAlternativa(questaoId, alternativaIndex) {
            const q = questoesSelecionadas.find(item => item.id === questaoId);
            q.alternativas.forEach((_, idx) => {
                const el = document.getElementById(`alt-${questaoId}-${idx}`);
                if (el) el.classList.remove('selecionada');
            });

            const itemSelecionado = document.getElementById(`alt-${questaoId}-${alternativaIndex}`);
            if (itemSelecionado) itemSelecionado.classList.add('selecionada');

            respostasEstudante[questaoId] = alternativaIndex;
        }

        // Gerenciamento de Tempo
        function iniciarCronometro() {
            tempoSegundos = 0;
            cronometroInterval = setInterval(() => {
                tempoSegundos++;
                const minutos = Math.floor(tempoSegundos / 60).toString().padStart(2, '0');
                const segundos = (tempoSegundos % 60).toString().padStart(2, '0');
                document.getElementById('tempo').innerText = `${minutos}:${segundos}`;
            }, 1000);
        }

        // Processa as respostas e aplica as formatações visuais pós-gabarito
        function corrigirSimulado() {
            clearInterval(cronometroInterval);
            let acertos = 0;

            questoesSelecionadas.forEach((questao) => {
                const respostaUsuario = respostasEstudante[questao.id];
                const respostaCorreta = questao.correta;

                questao.alternativas.forEach((_, idx) => {
                    const item = document.getElementById(`alt-${questao.id}-${idx}`);
                    item.classList.add('bloqueada');

                    if (idx === respostaCorreta) {
                        item.classList.add('correta');
                        if (respostaUsuario === respostaCorreta && idx === respostaUsuario) {
                            const span = document.createElement('span');
                            span.className = 'feedback-label';
                            span.innerHTML = '<i class="fa-solid fa-check"></i> Você Acertou';
                            item.appendChild(span);
                        } else {
                            const span = document.createElement('span');
                            span.className = 'feedback-label';
                            span.innerText = 'Gabarito Oficial';
                            item.appendChild(span);
                        }
                    }

                    if (respostaUsuario !== undefined && respostaUsuario !== respostaCorreta && idx === respostaUsuario) {
                        item.classList.add('errada');
                        const span = document.createElement('span');
                        span.className = 'feedback-label';
                        span.innerHTML = '<i class="fa-solid fa-xmark"></i> Sua Resposta';
                        item.appendChild(span);
                    }
                });

                if (respostaUsuario === respostaCorreta) {
                    acertos++;
                }
            });

            const cardResultado = document.getElementById('resultado-card');
            document.getElementById('score-text').innerText = `Você acertou ${acertos} de ${questoesSelecionadas.length} questões!`;
            cardResultado.style.display = 'block';

            document.getElementById('btn-corrigir').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
